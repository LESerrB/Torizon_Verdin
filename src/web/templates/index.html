<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <link rel="stylesheet" href="../static/css/vars.css">
        <link rel="stylesheet" href="../static/css/style.css">

        <title>DUAL</title>
    </head>

    <body>
        <div class="pantalla-base">
            <div class="header">
                <button class="btn-mode" id="btn-mode"></button>
                <button class="btn-alarm" id="btn-alarm"></button>
                <button class="btn-lock" id="btn-lock"></button>
            </div>

            <div class="info-mod" id="info-mod">
                <div class="bkgnd-info">
                    <div class="side-info" id="info-lft">
                        <div class="info-title active">MODO BEBÉ</div>
                            <div class="info-value">--.-<span class="units"> °C</span></div>

                        <div>Temp. Prog. <div>--.-<span>°C</span></div>
                            <button class="btn-sensor" id="btn-tempMas"><div class="btn-snsr-lbl">-</div></button>
                            <button class="btn-sensor" id="btn-tempAcept"><div class="btn-snsr-lbl">Aceptar</div></button>
                            <button class="btn-sensor" id="btn-tempMenos"><div class="btn-snsr-lbl">+</div></button>
                        </div>

                        <div>Temp. Aux. <div>--.-<span>°C</span></div>
                        </div>
                    </div>

                    <div class="side-info" id="info-rgt">
                        <div class="info-title inactive">MODO MANUAL</div>
                            <div class="info-value">--<span class="units"> %</span></div>
                            <div>
                                Aqui va las lineas de potencia
                                <button class="btn-sensor" id="btn-tempMas"><div class="btn-snsr-lbl">-</div></button>
                                <button class="btn-sensor" id="btn-tempAcept"><div class="btn-snsr-lbl">Aceptar</div></button>
                                <button class="btn-sensor" id="btn-tempMenos"><div class="btn-snsr-lbl">+</div></button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="bckgnd-btns">
                    <div class="module inactive">
                        <div class="mdl-title bg-scale">Báscula</div>
                        <div class="mod-value">--.-<span class="mod-units"> Kg</span></div>
                        <div class="mod-btns">
                            <button class="btn-sensor" id="btn-pesar"><div class="btn-snsr-lbl">Pesar</div></button>
                            <button class="btn-sensor" id="btn-tara"><div class="btn-snsr-lbl">Tara</div></button>
                        </div>
                    </div>

                    <div class="module inactive">
                        <div class="mdl-title bg-timer">Cronómetro</div>
                        <div class="mod-value">--:--<span class="mod-units"> seg</span></div>
                        <div class="mod-btns">
                            <button class="btn-sensor" id="btn-pesar"><div class="btn-snsr-lbl">Iniciar</div></button>
                            <button class="btn-sensor" id="btn-tara"><div class="btn-snsr-lbl">Limpiar</div></button>
                        </div>
                    </div>
                    
                    <div class="module inactive">
                        <div class="mdl-title bg-phototherapy">Fototerapia</div>
                        <div class="mod-value">--:--<span class="mod-units"> HH:MM</span></div>
                        <div class="mod-value">--<span class="mod-units">%</span></div>
                    </div>

                    <div class="module inactive">
                        <div class="mdl-title bg-humidity">Húmedad</div>
                        <div class="mod-value">--.-<span class="mod-units"> % HR</span></div>
                    </div>

                    <div class="module inactive">
                        <div class="mdl-title bg-oxygen">Oxigeno</div>
                        <div class="mod-value">--.-<span class="mod-units"> %</span></div>
                    </div>

                    <div class="module inactive">
                        <div class="mdl-title bg-height">Altura Variable</div>
                    </div>
                </div>
            </div>

            <div class="footer" id="footer">
                <div class="paciente-cnt">
                    <div class="paciente-lbl">Paciente:</div>
                    <div class="paciente-nmb">
                        <span id="pacienteNom">NOMBRE</span>
                        <span id="aPPaciente">AP PATERNO</span>
                        <span id="aMPaciente">AP MATERNO</span>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
