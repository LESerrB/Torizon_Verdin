<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <link rel="stylesheet" href="../static/css/vars.css">
        <link rel="stylesheet" href="../static/css/style.css">

        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/luxon@2.5.0/build/global/luxon.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon@1.2.0/dist/chartjs-adapter-luxon.min.js"></script>
        
        <script type="module" src="../static/js/app.js"></script>

        <title>DUAL</title>
    </head>

    <body>
        <!----------------------------------------------------------------------->
        <!---------------------------- BARRA SUPERIOR --------------------------->
        <!----------------------------------------------------------------------->
        <div class="header">
            <button class="btn-mode" id="btn-mode" tabindex="1">Cuna/Incubadora</button>
            <button class="btn-alarm" id="btn-alarm" tabindex="2">ALARMA</button>
            <button class="btn-mode" id="btn-lock" tabindex="3">Lock/Unlock</button>
        </div>

        <!----------------------------------------------------------------------->
        <!--------------------------- PANEL PRINCIPAL --------------------------->
        <!----------------------------------------------------------------------->
        <div class="pantalla-base">
            <div class="info-mod" id="info-mod">
                <div class="bkgnd-info">
                    <!-------------------------- MODO BEBÉ -------------------------->
                    <div class="side-info">
                        <div class="info-title active" id="modo-bebe" tabindex="4">MODO BEBÉ</div>
                            <div class="info-value active" id="temp">--.-<span class="units"> °C </span></div>

                        <div class="ctrl-temp">
                            <div class="ctrl-row">
                                <div class="ctrl-label active" id="tempProg-lbl">
                                    <div>Temp.</div>
                                    <div>Prog.</div>
                                </div>
                                
                                <div class="ctrl-val active" id="tempProg-val">
                                    <div class="value" id="tempProg" tabindex="5">--.-</div>
                                    <div class="units">°C</div>
                                </div>

                                <button class="btn-sensor active" id="tmpPrgSobregiro"><div class="btn-snsr-lbl active" id="tmpPrgSobregiro-lbl"> &gt; 37 </div></button>
                            </div>

                            <div class="ctrl-btns">
                                <button class="btn-sensor active" id="tempProgMenos" tabindex="6"><div class="btn-snsr-lbl active" id="tempProgMenos-lbl">-</div></button>
                                <button class="btn-sensor active" id="tempProgAceptar" tabindex="8"><div class="btn-snsr-lbl active" id="tempProgAceptar-lbl">Aceptar</div></button>
                                <button class="btn-sensor active" id="tempProgMas" tabindex="7"><div class="btn-snsr-lbl active" id="tempProgMas-lbl">+</div></button>
                            </div>
                            
                            <div class="ctrl-row">
                                <div class="ctrl-label active" id="tempAux-lbl">
                                    <div>Temp.</div>
                                    <div>Aux.</div>
                                </div>
                                
                                <div class="ctrl-val active" id="tempAux-val">
                                    <div class="value" id="sondaAux">--.-</div>
                                    <div class="units">°C</div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!------------------------- MODO MANUAL ------------------------->
                    <div class="side-info">
                        <div class="info-title inactive" id="modo-manual" tabindex="9">MODO MANUAL</div>
                            <div class="info-value inactive" id="potCalef-val" tabindex="10">--<span class="units"> % </span></div>

                            <div class="ctrl-pot">
                                <div class="pot-indicators">
                                    <div class="bar" style="--level: 1"></div>
                                    <div class="bar" style="--level: 2"></div>
                                    <div class="bar" style="--level: 3"></div>
                                    <div class="bar" style="--level: 4"></div>
                                    <div class="bar" style="--level: 5"></div>
                                    <div class="bar" style="--level: 6"></div>
                                    <div class="bar" style="--level: 7"></div>
                                    <div class="bar" style="--level: 8"></div>
                                    <div class="bar" style="--level: 9"></div>
                                    <div class="bar" style="--level: 10"></div>
                                </div>

                                <div class="ctrl-btns">
                                    <button class="btn-sensor inactive" id="calefMenos" tabindex="11"><div class="btn-snsr-lbl inactive" id="calefMenos-lbl">-</div></button>
                                    <button class="btn-sensor inactive" id="calefAceptar" tabindex="13"><div class="btn-snsr-lbl inactive" id="calefAceptar-lbl">Aceptar</div></button>
                                    <button class="btn-sensor inactive" id="calefMas" tabindex="12"><div class="btn-snsr-lbl inactive" id="calefMas-lbl">+</div></button>
                                </div>
                            </div>
                    </div>
                </div>
            </div>

            <!----------------------------------------------------------------------->
            <!---------------------------- PANEL LATERAL ---------------------------->
            <!----------------------------------------------------------------------->
            <div class="bckgnd-btns" id="modules-container">
                <div class="module inactive" id="mdcnt-bascula">
                    <div class="mdl-title bg-scale" id="bascula" tabindex="14">Báscula</div>
                    <div><button class="btn-cancel" id="btn-close-Scale" tabindex="18"><div class="btn-snsr-lbl active"> Salir </div></button></div>
                    <div class="mod-value" id="peso"> -.-- <span class="mod-units"> Kg </span></div>

                    <div class="mod-btns">
                        <button class="btn-sensor active" id="btn-pesar" tabindex="15"><div class="btn-snsr-lbl active">Pesar</div></button>
                        <button class="btn-sensor active" id="btn-tara" tabindex="16"><div class="btn-snsr-lbl active">Tara</div></button>
                    </div>

                    <div id="hc-scale" class="hidden-ctrls">
                        <button class="btn-sensor active" id="btn-calib" tabindex="17"><div class="btn-snsr-lbl active">Calibración</div></button>
                    </div>
                </div>

                <div class="module inactive" id="mdcnt-timer">
                    <div class="mdl-title bg-timer" id="timer" tabindex="19">Cronómetro Apgar</div>
                    <div><button class="btn-cancel" id="btn-close-Timer" tabindex="22"><div class="btn-snsr-lbl active"> Salir </div></button></div>
                    <div class="mod-value" id="cronApgar">mm:ss</div>

                    <div class="mod-btns">
                        <button class="btn-sensor active" id="btn-startpause" tabindex="20"><div class="btn-snsr-lbl active">Iniciar</div></button>
                        <button class="btn-sensor active" id="btn-clear" tabindex="21"><div class="btn-snsr-lbl active">Limpiar</div></button>
                    </div>
                </div>

                <div class="module inactive" id="mdcnt-photo">
                    <div class="mdl-title bg-phototherapy" id="photo" tabindex="23">Fototerapia</div>
                    <div><button class="btn-cancel" id="btn-close-Photo" tabindex="26"><div class="btn-snsr-lbl active"> Salir </div></button></div>

                    <div id="sc-photo">
                        <div class="mod-value" id="timer-value-P"> HH:mm </div>
                        <div class="mod-value" id="photo-value-P"> -- <span class="mod-units"> % </span></div>
                    </div>

                    <div id="hc-photo" class="hidden-ctrls">
                        <div class="sliders-container">
                            <div class="slider-group">
                                <input type="range" min="0" max="100" value="0" class="slider vertical" id="photo-intensity" tabindex="24">
                                <label class="slider-label" id="photo-value-S"> -- <span class="mod-units"> % </span></label>
                            </div>

                            <div class="slider-group">
                                <input type="range" min="0" max="100" value="0" class="slider vertical" id="exam-intensity" tabindex="25">
                                <label class="slider-label" id="exam-value"> -- <span class="mod-units"> % </span></label>
                            </div>
                        </div>

                        <div class="slider-group">
                            <label class="slider-label" id="timer-value-S"> --:-- </label>
                        </div>
                    </div>
                </div>

                <div class="module inactive" id="mdcnt-humed">
                    <div class="mdl-title bg-humidity" id="humed" tabindex="27">Húmedad</div>
                    <div><button class="btn-cancel" id="btn-close-Humed" tabindex="28"><div class="btn-snsr-lbl active"> Salir </div></button></div>

                    <div class="mod-value" id="valHR"> --.- <span class="mod-units"> % HR </span></div>
                </div>

                <div class="module inactive" id="mdcnt-satOx">
                    <div class="mdl-title bg-oxygen" id="satOx" tabindex="29">Oxigeno</div>
                    <div><button class="btn-cancel" id="btn-close-satOx" tabindex="30"><div class="btn-snsr-lbl active"> Salir </div></button></div>

                    <div class="mod-value" id="valsatOx"> --.- <span class="mod-units"> % </span></div>
                </div>

                <div class="module inactive" id="mdcnt-altVar">
                    <div class="mdl-title bg-height" id="altVar" tabindex="31">Altura Variable</div>
                    <div><button class="btn-cancel" id="btn-close-altVar" tabindex="38"><div class="btn-snsr-lbl active"> Salir </div></button></div>

                    <div class="ctrl-hgt">
                        <div class="hgt-left">
                            <button class="btn-hgt" id="btn-upLmp" tabindex="36"><div class="btn-hgt-lbl">&lt;&lt;</div></button>
                            <button class="btn-hgt" id="btn-dwnLmp" tabindex="37"><div class="btn-hgt-lbl">&gt;&gt;</div></button>
                        </div>

                        <div class="hgt-right">
                            <div>
                                <button class="btn-hgt" id="btn-up" tabindex="32"><div class="btn-hgt-lbl">&lt;&lt;</div></button>

                                <div class="ctrl-Bcnt">
                                    <button class="btn-hgt" id="btn-incLft" tabindex="34"><div class="btn-hgt-lbl">&lt;&lt;</div></button>
                                    <button class="btn-hgt" id="btn-incRgt" tabindex="35"><div class="btn-hgt-lbl">&gt;&gt;</div></button>
                                </div>

                                <button class="btn-hgt" id="btn-dwn" tabindex="37"><div class="btn-hgt-lbl">&gt;&gt;</div></button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!----------------------------------------------------------------------->
        <!---------------------------- BARRA INFERIOR --------------------------->
        <!----------------------------------------------------------------------->
        <div class="footer" id="footer">
            <div class="paciente-lbl">
                <span class="paciente-label">Paciente:</span>
                <span class="paciente-fecha" id="date-clk"> --/--/-- --:--:-- </span>
            </div>

            <div class="paciente-form-row">
                <div class="paciente-cnt">
                    <div class="paciente-nmb" id="paciente" tabindex="40">
                        <span id="pacienteNom">NOMBRE</span>
                        <span id="apP_Paciente">AP PATERNO</span>
                        <span id="apM_Paciente">AP MATERNO</span>
                    </div>

                    <div id="paciente-input" class="input-cont">
                        <input id="nom-input" class="paciente-input" type="text">
                        <input id="apP-input" class="paciente-input" type="text">
                        <input id="apM-input" class="paciente-input" type="text">
                        <button class="btn-sensor active" id="btn-OK"><div class="btn-snsr-lbl"> OK </div></button>
                    </div>
                </div>

                <div class="graf-btn">
                <button class="btn-graf" id="btn-tendencias" tabindex="39">GRAF</button>
                </div>
            </div>

            <!-- Sección expandible -->
            <div class="graf-tendencias" id="graf-tendencias">
                <!-- Aquí va la gráfica -->
                <div class="background-graf">
                    <div class="chart-controls">
                        <div class="control-group">
                            <label class="ctrl-txt" for="duration-select">Duración del registro:</label>
                            <select id="duration-select">
                                <option value="24">24 horas</option>
                                <option value="48">48 horas</option>
                                <option value="72">72 horas</option>
                            </select>
                        </div>

                        <div class="control-group">
                            <label class="ctrl-txt" for="interval-select">Intervalo de guardado:</label>
                            <select id="interval-select">
                                <option value="1">1 minuto</option>
                                <option value="5">5 minutos</option>
                                <option value="10">10 minutos</option>
                                <option value="30">30 minutos</option>
                                <option value="60">1 hora</option>
                            </select>
                        </div>

                        <button id="start-recording-btn" class="chart-button">Iniciar Registro</button>
                        <button id="stop-recording-btn" class="chart-button" disabled>Detener Registro</button>
                        <button id="clear-chart-btn" class="chart-button">Limpiar Gráfico</button>
                    </div>

                    <div class="chart-container">
                        <canvas id="temperatureChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </body>

        <!----------------------------------------------------------------------->
        <!-------------------------------- ALARMA ------------------------------->
        <!----------------------------------------------------------------------->
    <div id="alarma" class="alert-overlay oculto" role="dialog" aria-hidden="true">
        <div class="alert-box" id="alarma-box"> Mensaje </div>
    </div>
</html>
