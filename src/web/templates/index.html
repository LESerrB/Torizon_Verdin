<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <link rel="stylesheet" href="../static/css/vars.css">
        <link rel="stylesheet" href="../static/css/style.css">

        <title>DUAL</title>
    </head>

    <body>
        <div class="pantalla-base">
            <div class="header">
                <button class="btn-mode" id="btn-mode"></button>
                <button class="btn-alarm" id="btn-alarm"></button>
                <button class="btn-lock" id="btn-lock"></button>
            </div>

            <div class="info-mod" id="info-mod">
                <div class="bkgnd-info">
                    <div class="side-info" id="info-lft">
                        <div class="info-title active">MODO BEBÉ</div>
                            <div class="info-value">--.-<span class="units">°C</span></div>
                    </div>

                    <div class="side-info" id="info-rgt">
                        <div class="info-title inactive">MODO MANUAL</div>
                            <div class="info-value">--<span class="units">%</span></div>
                    </div>
                </div>

                <div class="bckgnd-btns">
                    <div class="module inactive">
                        <div class="mdl-title">Báscula</div>
                        --.- Kg
                        <!-- <button class="btn-sensor" id="btn-sensor-1">
                        </button> -->
                    </div>

                    <div class="module inactive">
                        <div class="mdl-title">Luz Examinación</div>
                        <!-- <button class="btn-sensor" id="btn-sensor-1">
                        </button> -->
                    </div>

                    <div class="module inactive">
                        <div class="mdl-title">Húmedad</div>
                        --.- %HR
                        <!-- <button class="btn-sensor" id="btn-sensor-1">
                        </button> -->
                    </div>

                    <div class="module inactive">
                        <div class="mdl-title">Oxigeno</div>
                        --.- %
                        <!-- <button class="btn-sensor" id="btn-sensor-1">
                        </button> -->
                    </div>
                </div>
            </div>

            <div class="footer" id="footer">
                <div class="paciente-cnt">
                    <div class="paciente-lbl">Paciente:</div>
                    <div class="paciente-nmb">
                        <span id="pacienteNom">NOMBRE</span>
                        <span id="aPPaciente">AP PATERNO</span>
                        <span id="aMPaciente">AP MATERNO</span>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
