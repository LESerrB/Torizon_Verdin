<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <link rel="stylesheet" href="../static/css/vars.css">
        <link rel="stylesheet" href="../static/css/style.css">

        <script type="module" src="../static/js/main.js"></script>

        <title>DUAL</title>
    </head>

    <body>
        <div class="pantalla-base">
            <div class="header">
                <button class="btn-mode" id="btn-mode">Cuna/Incubadora</button>
                <button class="btn-alarm" id="btn-alarm">ALARMA</button>
                <button class="btn-lock" id="btn-lock">Lock/Unlock</button>
            </div>

            <div class="info-mod" id="info-mod">
                <div class="bkgnd-info">
                    <div class="side-info">
                        <div class="info-title active" id="modo-bebe">MODO BEBÉ</div>
                            <div class="info-value active" id="temp">--.-<span class="units"> °C </span></div>

                        <div class="ctrl-temp">
                            <div class="ctrl-row">
                                <div class="ctrl-label active" id="tempProg-lbl">
                                    <div>Temp.</div>
                                    <div>Prog.</div>
                                </div>
                                
                                <div class="ctrl-val active" id="tempProg-val">
                                    <div class="value" id="tempProg">--.-</div>
                                    <div class="units">°C</div>
                                </div>

                                <button class="btn-sensor active" id="tmpPrgSobregiro"><div class="btn-snsr-lbl active" id="tmpPrgSobregiro-lbl"> &gt; 37 </div></button>
                            </div>

                            <div class="ctrl-btns">
                                <button class="btn-sensor active" id="tempProgMenos"><div class="btn-snsr-lbl active" id="tempProgMenos-lbl">-</div></button>
                                <button class="btn-sensor active" id="tempProgAceptar"><div class="btn-snsr-lbl active" id="tempProgAceptar-lbl">Aceptar</div></button>
                                <button class="btn-sensor active" id="tempProgMas"><div class="btn-snsr-lbl active" id="tempProgMas-lbl">+</div></button>
                            </div>
                            
                            <div class="ctrl-row">
                                <div class="ctrl-label active" id="tempAux-lbl">
                                    <div>Temp.</div>
                                    <div>Aux.</div>
                                </div>
                                
                                <div class="ctrl-val active" id="tempAux-val">
                                    <div class="value" id="sondaAux">--.-</div>
                                    <div class="units">°C</div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="side-info">
                        <div class="info-title inactive" id="modo-manual">MODO MANUAL</div>
                            <div class="info-value inactive" id="potCalef-val">--<span class="units"> % </span></div>

                            <div class="ctrl-pot">
                                <div class="pot-indicators">
                                    <div class="bar" style="--level: 1"></div>
                                    <div class="bar" style="--level: 2"></div>
                                    <div class="bar" style="--level: 3"></div>
                                    <div class="bar" style="--level: 4"></div>
                                    <div class="bar" style="--level: 5"></div>
                                    <div class="bar" style="--level: 6"></div>
                                    <div class="bar" style="--level: 7"></div>
                                    <div class="bar" style="--level: 8"></div>
                                    <div class="bar" style="--level: 9"></div>
                                    <div class="bar" style="--level: 10"></div>
                                </div>

                                <div class="ctrl-btns">
                                    <button class="btn-sensor inactive" id="calefMenos"><div class="btn-snsr-lbl inactive" id="calefMenos-lbl">-</div></button>
                                    <button class="btn-sensor inactive" id="calefAceptar"><div class="btn-snsr-lbl inactive" id="calefAceptar-lbl">Aceptar</div></button>
                                    <button class="btn-sensor inactive" id="calefMas"><div class="btn-snsr-lbl inactive" id="calefMas-lbl">+</div></button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="bckgnd-btns">
                    <div class="module inactive">
                        <div class="mdl-title bg-scale" id="bascula">Báscula</div>
                        <div class="mod-value">--.-<span class="mod-units"> Kg</span></div>
                        <div class="mod-btns">
                            <button class="btn-sensor active" id="btn-pesar"><div class="btn-snsr-lbl active">Pesar</div></button>
                            <button class="btn-sensor active" id="btn-tara"><div class="btn-snsr-lbl active">Tara</div></button>
                            <!-- <button class="btn-sensor active" id="btn-calib"><div class="btn-snsr-lbl active">Calibración</div></button> -->
                        </div>
                    </div>

                    <div class="module inactive">
                        <div class="mdl-title bg-timer" id="timer">Cronómetro</div>
                        <div class="mod-value">--:--<span class="mod-units"> seg</span></div>
                        <div class="mod-btns">
                            <button class="btn-sensor active" id="btn-start"><div class="btn-snsr-lbl active">Iniciar</div></button>
                            <button class="btn-sensor active" id="btn-stop"><div class="btn-snsr-lbl active">Limpiar</div></button>
                        </div>
                    </div>
                    
                    <div class="module inactive">
                        <div class="mdl-title bg-phototherapy" id="photo">Fototerapia</div>
                        <div class="mod-value">--:--<span class="mod-units"> HH:MM</span></div>
                        <div class="mod-value">--<span class="mod-units">%</span></div>
                    </div>

                    <div class="module inactive">
                        <div class="mdl-title bg-humidity" id="humed">Húmedad</div>
                        <div class="mod-value">--.-<span class="mod-units"> % HR</span></div>
                    </div>

                    <div class="module inactive">
                        <div class="mdl-title bg-oxygen" id="satOx">Oxigeno</div>
                        <div class="mod-value">--.-<span class="mod-units"> %</span></div>
                    </div>

                    <div class="module inactive">
                        <div class="mdl-title bg-height" id="altVar">Altura Variable</div>

                        <div class="ctrl-hgt">
                            <div class="hgt-left">
                                <button class="btn-hgt" id="btn-upLmp"><div class="btn-hgt-lbl">&lt;&lt;</div></button>
                                <button class="btn-hgt" id="btn-dwnLmp"><div class="btn-hgt-lbl">&gt;&gt;</div></button>
                            </div>

                            <div class="hgt-right">
                                <div>
                                    <button class="btn-hgt" id="btn-up"><div class="btn-hgt-lbl">&lt;&lt;</div></button>

                                    <div class="ctrl-Bcnt">
                                        <button class="btn-hgt" id="btn-incLft"><div class="btn-hgt-lbl">&lt;&lt;</div></button>
                                        <button class="btn-hgt" id="btn-incRgt"><div class="btn-hgt-lbl">&gt;&gt;</div></button>
                                    </div>

                                    <button class="btn-hgt" id="btn-dwn"><div class="btn-hgt-lbl">&gt;&gt;</div></button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="footer" id="footer">
                <div class="paciente-cnt">
                    <div class="paciente-lbl">Paciente:</div>

                    <div class="paciente-nmb" id="paciente">
                        <span id="pacienteNom">NOMBRE</span>
                        <span id="apP_Paciente">AP PATERNO</span>
                        <span id="apM_Paciente">AP MATERNO</span>
                    </div>

                    <div id="paciente-input" class="input-cont">
                        <input id="nom-input" class="paciente-input" type="text">
                        <input id="apP-input" class="paciente-input" type="text">
                        <input id="apM-input" class="paciente-input" type="text">

                        <button class="btn-sensor active" id="btn-OK"><div class="btn-snsr-lbl"> OK </div></button>
                    </div>
                </div>

                <div> <button class="btn-graf" id="tendencias">GRAF</button> </div>
            </div>
        </div>
    </body>
</html>
